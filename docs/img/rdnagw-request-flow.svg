<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 860" width="1600" height="860"><defs><marker id="a2ec4d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2ec4d6"/></marker><marker id="s2ec4d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2ec4d6"/></marker><marker id="a6aa8ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6aa8ff"/></marker><marker id="s6aa8ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6aa8ff"/></marker><marker id="a8b93a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b93a1"/></marker><marker id="s8b93a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b93a1"/></marker><marker id="aff6b7f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b7f"/></marker><marker id="sff6b7f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b7f"/></marker></defs><rect width="100%" height="100%" fill="#12151c"/><text x="40" y="52" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#d7dce4" text-anchor="start" font-weight="700">Inside rdnagw: one request</text><text x="40" y="80" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#8b93a1" text-anchor="start">From the client to a llama-server worker and back, and what each step emits.</text><rect x="40" y="130" width="200" height="176" rx="12" fill="#1c212b" stroke="#343b4a" stroke-width="1.5"/><rect x="40" y="140" width="4" height="156" rx="2" fill="#b892ff"/><text x="56" y="158" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d7dce4" text-anchor="start" font-weight="700">Client</text><text x="56" y="180" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Any OpenAI client</text><text x="56" y="200" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#8b93a1" text-anchor="start">POST /v1/chat/</text><text x="56" y="220" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#8b93a1" text-anchor="start">completions</text><text x="56" y="240" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">model: a name or auto</text><rect x="280" y="130" width="230" height="176" rx="12" fill="#1c212b" stroke="#343b4a" stroke-width="1.5"/><rect x="280" y="140" width="4" height="156" rx="2" fill="#8b93a1"/><text x="296" y="158" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d7dce4" text-anchor="start" font-weight="700">Auth and limits</text><text x="296" y="180" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Bearer api_key, if set</text><text x="296" y="200" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Body up to 64 MiB, JSON</text><text x="296" y="220" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">X-Gateway-Policy override</text><text x="296" y="240" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Span starts (traceparent)</text><rect x="550" y="130" width="300" height="176" rx="12" fill="#1c212b" stroke="#343b4a" stroke-width="1.5"/><rect x="550" y="140" width="4" height="156" rx="2" fill="#6aa8ff"/><text x="566" y="158" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d7dce4" text-anchor="start" font-weight="700">Model resolution</text><text x="566" y="180" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Named model: used as is</text><text x="566" y="200" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">auto: class, then target (below)</text><text x="566" y="220" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Body's model set to the target</text><text x="566" y="240" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Prefix chain hashed for routing</text><rect x="890" y="130" width="330" height="176" rx="12" fill="#1c212b" stroke="#343b4a" stroke-width="1.5"/><rect x="890" y="140" width="4" height="156" rx="2" fill="#ff6b7f"/><text x="906" y="158" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d7dce4" text-anchor="start" font-weight="700">Router</text><text x="906" y="180" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Healthy workers serving the model;</text><text x="906" y="200" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">fallback workers only if none</text><text x="906" y="220" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">least-loaded: in flight ÷ (slots × weight)</text><text x="906" y="240" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">ties: the worker with the warm prefix</text><text x="906" y="260" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">or cache-aware, cost-aware, round-robin</text><text x="906" y="280" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Retry: same worker, next, next model</text><rect x="1260" y="130" width="300" height="176" rx="12" fill="#1c212b" stroke="#343b4a" stroke-width="1.5"/><rect x="1260" y="140" width="4" height="156" rx="2" fill="#2ec4d6"/><text x="1276" y="158" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d7dce4" text-anchor="start" font-weight="700">Worker</text><text x="1276" y="180" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2ec4d6" text-anchor="start">gemma4 · gpt-oss · lfm2</text><text x="1276" y="200" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">llama-server, ROCm</text><text x="1276" y="220" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Prefix cache skips the shared prompt</text><text x="1276" y="240" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Prefill, then decode in a slot</text><text x="1276" y="260" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">503 while loading → retried elsewhere</text><polyline points="240,190 280,190" fill="none" stroke="#8b93a1" stroke-width="2" stroke-linejoin="round" marker-end="url(#a8b93a1)"/><polyline points="510,190 550,190" fill="none" stroke="#8b93a1" stroke-width="2" stroke-linejoin="round" marker-end="url(#a8b93a1)"/><polyline points="850,190 890,190" fill="none" stroke="#8b93a1" stroke-width="2" stroke-linejoin="round" marker-end="url(#a8b93a1)"/><polyline points="1220,190 1260,190" fill="none" stroke="#8b93a1" stroke-width="2" stroke-linejoin="round" marker-end="url(#a8b93a1)"/><polyline points="1260,270 1222,270" fill="none" stroke="#ff6b7f" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#aff6b7f)"/><rect x="550" y="384" width="1010" height="160" rx="16" fill="none" stroke="#6aa8ff" stroke-width="1.6" stroke-dasharray="7 6"/><rect x="568" y="372" width="83.0" height="24" rx="6" fill="#12151c" stroke="none" stroke-width="1.5"/><text x="574" y="389" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#6aa8ff" text-anchor="start" font-weight="700">auto model</text><rect x="570" y="412" width="225" height="112" rx="12" fill="#1c212b" stroke="#343b4a" stroke-width="1.5"/><rect x="570" y="422" width="4" height="92" rx="2" fill="#6aa8ff"/><text x="586" y="440" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d7dce4" text-anchor="start" font-weight="700">1 · Affinity</text><text x="586" y="462" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Conversation key: header,</text><text x="586" y="482" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">or system + first message</text><text x="586" y="502" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Pinned: reuse its model</text><rect x="820" y="412" width="225" height="112" rx="12" fill="#1c212b" stroke="#343b4a" stroke-width="1.5"/><rect x="820" y="422" width="4" height="92" rx="2" fill="#6aa8ff"/><text x="836" y="440" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d7dce4" text-anchor="start" font-weight="700">2 · Rules</text><text x="836" y="462" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">tools, small max_tokens,</text><text x="836" y="482" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">system prompt hints,</text><text x="836" y="502" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">code fence, long prompt</text><rect x="1070" y="412" width="225" height="112" rx="12" fill="#1c212b" stroke="#343b4a" stroke-width="1.5"/><rect x="1070" y="422" width="4" height="92" rx="2" fill="#f6c35f"/><text x="1086" y="440" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d7dce4" text-anchor="start" font-weight="700">3 · Classifier</text><text x="1086" y="462" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">lfm2:8b on a worker</text><text x="1086" y="482" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">One word, 800 ms cap</text><text x="1086" y="502" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Timeout → default class</text><rect x="1320" y="412" width="220" height="112" rx="12" fill="#1c212b" stroke="#343b4a" stroke-width="1.5"/><rect x="1320" y="422" width="4" height="92" rx="2" fill="#6aa8ff"/><text x="1336" y="440" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d7dce4" text-anchor="start" font-weight="700">4 · Targets</text><text x="1336" y="462" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Class models in order</text><text x="1336" y="482" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">First with a healthy</text><text x="1336" y="502" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">worker answers</text><polyline points="795,468 820,468" fill="none" stroke="#6aa8ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#a6aa8ff)"/><polyline points="1045,468 1070,468" fill="none" stroke="#6aa8ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#a6aa8ff)"/><polyline points="1295,468 1320,468" fill="none" stroke="#6aa8ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#a6aa8ff)"/><polyline points="700,306 700,410" fill="none" stroke="#6aa8ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#a6aa8ff)"/><rect x="654.8" y="341" width="90.4" height="21" rx="5" fill="#12151c" fill-opacity="0.92" stroke="none" stroke-width="1.5"/><text x="700" y="356" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#6aa8ff" text-anchor="middle">model = auto</text><polyline points="1430,412 1430,350 1055,350 1055,308" fill="none" stroke="#6aa8ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#a6aa8ff)"/><rect x="1174.7" y="331" width="130.60000000000002" height="21" rx="5" fill="#12151c" fill-opacity="0.92" stroke="none" stroke-width="1.5"/><text x="1240" y="346" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#6aa8ff" text-anchor="middle">target + fallbacks</text><polyline points="1560,218 1584,218 1584,580 140,580 140,308" fill="none" stroke="#2ec4d6" stroke-width="2" stroke-linejoin="round" marker-end="url(#a2ec4d6)"/><rect x="721.0" y="561" width="278.0" height="21" rx="5" fill="#12151c" fill-opacity="0.92" stroke="none" stroke-width="1.5"/><text x="860" y="576" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#2ec4d6" text-anchor="middle">SSE or JSON back, OpenAI shape unchanged</text><rect x="40" y="620" width="420" height="156" rx="12" fill="#1c212b" stroke="#343b4a" stroke-width="1.5"/><rect x="40" y="630" width="4" height="136" rx="2" fill="#b892ff"/><text x="56" y="648" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d7dce4" text-anchor="start" font-weight="700">Response headers</text><text x="56" y="670" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#8b93a1" text-anchor="start">X-Gateway-Worker, X-Gateway-Model</text><text x="56" y="690" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#8b93a1" text-anchor="start">X-Gateway-Route: least-loaded, prefix…</text><text x="56" y="710" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#8b93a1" text-anchor="start">with auto: auto:&lt;class&gt;:&lt;reason&gt;</text><text x="56" y="730" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#8b93a1" text-anchor="start">X-Gateway-Worker-Route: the worker pick</text><text x="56" y="750" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#8b93a1" text-anchor="start">X-Gateway-Matched-Blocks, traceparent</text><rect x="500" y="620" width="340" height="156" rx="12" fill="#1c212b" stroke="#343b4a" stroke-width="1.5"/><rect x="500" y="630" width="4" height="136" rx="2" fill="#2ec4d6"/><text x="516" y="648" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d7dce4" text-anchor="start" font-weight="700">Stream relay</text><text x="516" y="670" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Copied line by line, flushed</text><text x="516" y="690" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Silent stream: aborted at stall_timeout</text><text x="516" y="710" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">auto: model field → the real model</text><text x="516" y="730" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Usage and timings read on the way</text><rect x="880" y="620" width="330" height="156" rx="12" fill="#1c212b" stroke="#343b4a" stroke-width="1.5"/><rect x="880" y="630" width="4" height="136" rx="2" fill="#5ad8c4"/><text x="896" y="648" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d7dce4" text-anchor="start" font-weight="700">Metrics (/metrics)</text><text x="896" y="670" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">TTFT, per-token, duration, queue wait</text><text x="896" y="690" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">by worker, model, route, outcome</text><text x="896" y="710" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Routing and auto decision counts</text><text x="896" y="730" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Classifier latency histogram</text><rect x="1250" y="620" width="310" height="156" rx="12" fill="#1c212b" stroke="#343b4a" stroke-width="1.5"/><rect x="1250" y="630" width="4" height="136" rx="2" fill="#5ad8c4"/><text x="1266" y="648" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d7dce4" text-anchor="start" font-weight="700">Traces and logs (OTLP)</text><text x="1266" y="670" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">One span per request, GenAI</text><text x="1266" y="690" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">conventions: usage, TTFT, route</text><text x="1266" y="710" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Retry and stall span events</text><text x="1266" y="730" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Worker up/down log events</text><text x="800" y="816" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8b93a1" text-anchor="middle">No prompts or completions leave the gateway in telemetry: only names, counts and timings.</text></svg>
