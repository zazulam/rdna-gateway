olas, monospace" font-size="12.5" fill="#8b93a1" text-anchor="start">run_command (off unless enabled)</text><text x="776" y="530" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Per-turn git worktree, made on the first write</text><text x="776" y="550" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Confined to the root; .git writes refused</text><text x="776" y="570" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Offered only to local / private endpoints</text><rect x="1180" y="420" width="380" height="152" rx="12" fill="#1c212b" stroke="#343b4a" stroke-width="1.5"/><rect x="1180" y="430" width="4" height="132" rx="2" fill="#f6c35f"/><text x="1196" y="448" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d7dce4" text-anchor="start" font-weight="700">MCP tools</text><text x="1196" y="470" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#8b93a1" text-anchor="start">rdnamcp: web_search, fetch_url, search_docs,</text><text x="1196" y="490" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#8b93a1" text-anchor="start">remember, recall …</text><text x="1196" y="510" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Static bearer tokens stored on the device</text><text x="1196" y="530" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Exfiltration guard: no MCP calls after</text><text x="1196" y="550" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">a turn has read files</text><polyline points="1130,330 1130,380 950,380 950,420" fill="none" stroke="#ff6b7f" stroke-width="2" stroke-linejoin="round" marker-end="url(#aff6b7f)" marker-start="url(#sff6b7f)"/><rect x="968.0" y="357" width="144.0" height="21" rx="5" fill="#12151c" fill-opacity="0.92" stroke="none" stroke-width="1.5"/><text x="1040" y="372" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#ff6b7f" text-anchor="middle">tool calls / results</text><polyline points="1130,330 1130,380 1370,380 1370,420" fill="none" stroke="#f6c35f" stroke-width="2" stroke-linejoin="round" marker-end="url(#af6c35f)" marker-start="url(#sf6c35f)"/><rect x="40" y="420" width="300" height="132" rx="12" fill="#1c212b" stroke="#343b4a" stroke-width="1.5"/><rect x="40" y="430" width="4" height="112" rx="2" fill="#6aa8ff"/><text x="56" y="448" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d7dce4" text-anchor="start" font-weight="700">Quick tasks model</text><text x="56" y="470" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#6aa8ff" text-anchor="start">utility runtime</text><text x="56" y="490" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">lfm2:8b on CPU</text><text x="56" y="510" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Chat titles in ~0.6 s</text><text x="56" y="530" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Falls back to the chat model</text><rect x="380" y="420" width="340" height="132" rx="12" fill="#1c212b" stroke="#343b4a" stroke-width="1.5"/><rect x="380" y="430" width="4" height="112" rx="2" fill="#6aa8ff"/><text x="396" y="448" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d7dce4" text-anchor="start" font-weight="700">Model profiles</text><text x="396" y="470" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">gpt-oss: agent loops (reasoning low)</text><text x="396" y="490" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">gemma4: chat, summaries</text><text x="396" y="510" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">lfm2: quick jobs only</text><text x="396" y="530" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Context from /props or 32k table</text><rect x="40" y="640" width="1520" height="70" rx="12" fill="#171b23" stroke="#343b4a" stroke-width="1.5"/><text x="800" y="682" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#d7dce4" text-anchor="middle">All model calls → rdnagw gateway (desktop :8080) → gemma4 · gpt-oss · lfm2 · embeddings · rerank</text></svg>
