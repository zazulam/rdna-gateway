<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760"><defs><marker id="a8b93a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b93a1"/></marker><marker id="s8b93a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b93a1"/></marker><marker id="af6c35f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f6c35f"/></marker><marker id="sf6c35f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f6c35f"/></marker><marker id="aff6b7f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b7f"/></marker><marker id="sff6b7f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b7f"/></marker></defs><rect width="100%" height="100%" fill="#12151c"/><text x="40" y="52" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#d7dce4" text-anchor="start" font-weight="700">Hive offline harness: one agent turn</text><text x="40" y="80" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#8b93a1" text-anchor="start">Branch offline-harness. Every model call goes through the gateway; tools run locally or through rdnamcp.</text><rect x="40" y="140" width="220" height="92" rx="12" fill="#1c212b" stroke="#343b4a" stroke-width="1.5"/><rect x="40" y="150" width="4" height="72" rx="2" fill="#b892ff"/><text x="56" y="168" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d7dce4" text-anchor="start" font-weight="700">User message</text><text x="56" y="190" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Chat or workflow step</text><text x="56" y="210" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">in a workspace</text><rect x="300" y="140" width="300" height="172" rx="12" fill="#1c212b" stroke="#343b4a" stroke-width="1.5"/><rect x="300" y="150" width="4" height="152" rx="2" fill="#2ec4d6"/><text x="316" y="168" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d7dce4" text-anchor="start" font-weight="700">Context planner</text><text x="316" y="190" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2ec4d6" text-anchor="start">prefix-cache friendly</text><text x="316" y="210" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">System prompt byte-stable across turns</text><text x="316" y="230" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Summary sent as the first turn</text><text x="316" y="250" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Compact at 85% of window → 50%</text><text x="316" y="270" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Boundary kept across restarts</text><text x="316" y="290" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Summaries back off after failures</text><rect x="640" y="140" width="300" height="152" rx="12" fill="#1c212b" stroke="#343b4a" stroke-width="1.5"/><rect x="640" y="150" width="4" height="132" rx="2" fill="#5ad8c4"/><text x="656" y="168" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d7dce4" text-anchor="start" font-weight="700">Vault retrieval</text><text x="656" y="190" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#5ad8c4" text-anchor="start">optional</text><text x="656" y="210" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Embed query (EmbeddingGemma)</text><text x="656" y="230" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Top 20 vectors → rerank (bge)</text><text x="656" y="250" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Top 5 passages added to the</text><text x="656" y="270" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">latest user turn, not the system</text><rect x="980" y="140" width="300" height="152" rx="12" fill="#1c212b" stroke="#343b4a" stroke-width="1.5"/><rect x="980" y="150" width="4" height="132" rx="2" fill="#ff6b7f"/><text x="996" y="168" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d7dce4" text-anchor="start" font-weight="700">OpenAI-wire tool loop</text><text x="996" y="190" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#ff6b7f" text-anchor="start">gemma4:12b / gpt-oss:20b</text><text x="996" y="210" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Round budget 24 · repeat guard</text><text x="996" y="230" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Last round: tool_choice none</text><text x="996" y="250" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Reasoning passed back (gpt-oss)</text><text x="996" y="270" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8b93a1" text-anchor="start">Context guard stops tools near full</text><rect x="1320" y="140" width="240" height="112" rx="12" fill="#1c212b" 