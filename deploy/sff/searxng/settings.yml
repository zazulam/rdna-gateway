# Minimal SearXNG config for agent use: JSON output on, rate limiter off
# (it only listens on loopback, for rdnamcp). The secret comes from SEARXNG_SECRET.
use_default_settings: true
general:
  instance_name: rdna-search
  enable_metrics: false
server:
  limiter: false
  image_proxy: false
  method: GET
search:
  safe_search: 0
  formats: [html, json]
outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0
